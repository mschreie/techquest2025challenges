# The full credentials file is not part of the lab guide.
# credentials.html is listed with the lab guides and opens the team lookup.
<Directory /var/www/html>
    <Files "credentials.yaml">
        Require all denied
    </Files>
    IndexIgnore credentials.yaml
    AddDescription "Cluster ID, user ID, and password" credentials.html
</Directory>

RedirectMatch 302 ^/credentials\.html$ /cgi-bin/credentials.cgi
