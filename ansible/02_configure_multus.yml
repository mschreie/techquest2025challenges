---
- name: Ensure the participant Multus network is configured
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_tasks: tasks/configure_multus.yml
    network_patch:
      spec:
        template:
          spec:
            domain:
              devices:
                interfaces:
                  - name: default
                    masquerade: {}
                  - name: nic-flat
                    bridge: {}
            networks:
              - name: default
                pod: {}
              - name: nic-flat
                multus:
                  networkName: flatnetwork
  tasks:
    - name: Run this step on every cluster in env.sh
      ansible.builtin.include_tasks: tasks/for_each_cluster.yml
