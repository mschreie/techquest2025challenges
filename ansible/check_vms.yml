---
- name: Check lab VM readiness without changing the cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    expected_cluster_id: mpfcp
    user_ids:
      - 1

  tasks:
    - name: Read the active OpenShift API server
      ansible.builtin.command: oc whoami --show-server
      register: current_server
      changed_when: false

    - name: Confirm the active session is for the expected cluster
      ansible.builtin.assert:
        that:
          - current_server.stdout == 'https://api.cluster-' + expected_cluster_id + '.dyn.redhatworkshops.io:6443'
        fail_msg: >-
          The current oc session is {{ current_server.stdout }}; expected cluster
          {{ expected_cluster_id }}. Log in to the intended cluster before running this check.

    - name: Read VMI status for each participant namespace
      ansible.builtin.command: oc get vmi -n mtv-user{{ item }}
      loop: "{{ user_ids }}"
      register: vmi_status
      changed_when: false

    - name: Display the VMI status
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ vmi_status.results }}"
