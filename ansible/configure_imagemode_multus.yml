---
- name: Configure flatnetwork Multus interface on participant image-mode VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"

  tasks:
    - name: Read cluster settings and participant count from env.sh
      ansible.builtin.shell: |
        source ./env.sh
        cid="${MULTICLUSTERID:-$MUTLICLUSTERID}"
        first_cid=$(echo "$cid" | awk '{print $1}')
        target_cid="${TARGET_CLUSTER:-$first_cid}"
        printf "%s\n%s\n%s\n" "$cid" "$target_cid" "${MAXUSERS:-$MAXUSER}"
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      register: lab_settings
      changed_when: false

    - name: Store dynamic lab settings
      ansible.builtin.set_fact:
        configured_clusters: "{{ lab_settings.stdout_lines[0].split() }}"
        cluster_id: "{{ cluster_id if (cluster_id is defined and cluster_id | length > 0) else lab_settings.stdout_lines[1] }}"
        max_users: "{{ (max_users if (max_users is defined and max_users | length > 0) else lab_settings.stdout_lines[2]) | int }}"

    - name: Compute user project list dynamically
      ansible.builtin.set_fact:
        user_namespaces: "{{ q('sequence', 'start=1 count=' ~ max_users ~ ' format=mtv-user%d') }}"

    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Refuse to configure a different cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == "https://api.cluster-" + cluster_id + ".dyn.redhatworkshops.io:6443"
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == "admin"
        fail_msg: "Log in as admin before configuring network interfaces."

    - name: Check if flatnetwork NetworkAttachmentDefinition exists in each namespace
      ansible.builtin.command:
        argv:
          - oc
          - get
          - network-attachment-definition
          - flatnetwork
          - -n
          - "{{ item }}"
          - -o
          - name
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ user_namespaces }}"
      register: nad_presence
      changed_when: false
      failed_when: false

    - name: Ensure flatnetwork NetworkAttachmentDefinition is created if missing
      ansible.builtin.command:
        argv:
          - oc
          - create
          - -f
          - -
          - -n
          - "{{ item.item }}"
      args:
        stdin: |
          apiVersion: "k8s.cni.cncf.io/v1"
          kind: NetworkAttachmentDefinition
          metadata:
            name: flatnetwork
          spec:
            config: '{
              "cniVersion": "0.3.1",
              "name": "flatnetwork",
              "type": "macvlan",
              "master": "br-ex",
              "mode": "bridge",
              "ipam": {
                "type": "whereabouts",
                "range": "192.168.113.0/24"
              }
            }'
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ nad_presence.results }}"
      when: item.rc != 0
      changed_when: true

    - name: Check if rhel10imagemode VM exists in each participant namespace
      ansible.builtin.command:
        argv:
          - oc
          - get
          - vm
          - rhel10imagemode
          - -n
          - "{{ item }}"
          - -o
          - json
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ user_namespaces }}"
      register: vm_presence
      changed_when: false
      failed_when: false

    - name: Patch nic-flat network interface and Multus network into existing rhel10imagemode VMs
      ansible.builtin.command:
        argv:
          - oc
          - patch
          - vm
          - rhel10imagemode
          - -n
          - "{{ item.item }}"
          - --type=merge
          - -p
          - >-
            {
              "spec": {
                "template": {
                  "spec": {
                    "domain": {
                      "devices": {
                        "interfaces": [
                          {
                            "name": "default",
                            "masquerade": {}
                          },
                          {
                            "name": "nic-flat",
                            "bridge": {}
                          }
                        ]
                      }
                    },
                    "networks": [
                      {
                        "name": "default",
                        "pod": {}
                      },
                      {
                        "name": "nic-flat",
                        "multus": {
                          "networkName": "flatnetwork"
                        }
                      }
                    ]
                  }
                }
              }
            }
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ vm_presence.results }}"
      when: item.rc == 0
      register: patch_results
      changed_when: "'patched' in patch_results.stdout"

    - name: Restart rhel10imagemode VM to apply secondary network interface
      ansible.builtin.command:
        argv:
          - virtctl
          - restart
          - rhel10imagemode
          - -n
          - "{{ item.item }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ patch_results.results | default([]) }}"
      when:
        - not (item.skipped | default(false))
        - item.changed | default(false)
      changed_when: true
