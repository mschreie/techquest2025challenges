---
- name: Add flatnetwork to the image-mode VM
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_id: mpfcp
    vm_namespace: mtv-user1
    vm_name: rhel10imagemode
    confirm_restart: false
    network_patch:
      spec:
        template:
          spec:
            domain:
              devices:
                interfaces:
                  - name: default
                    masquerade: {}
                  - name: nic-flat
                    bridge: {}
            networks:
              - name: default
                pod: {}
              - name: nic-flat
                multus:
                  networkName: flatnetwork

  tasks:
    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Refuse to modify a different cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == 'https://api.cluster-' + cluster_id + '.dyn.redhatworkshops.io:6443'
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == 'admin'
        fail_msg: "Log in as admin before modifying the image-mode VM network."

    - name: Confirm flatnetwork exists in the participant project
      ansible.builtin.command:
        argv:
          - oc
          - get
          - network-attachment-definition
          - flatnetwork
          - -n
          - "{{ vm_namespace }}"
      changed_when: false

    - name: Read image-mode VM network template
      ansible.builtin.command:
        argv:
          - oc
          - get
          - vm
          - "{{ vm_name }}"
          - -n
          - "{{ vm_namespace }}"
          - -o
          - json
      register: vm_definition
      changed_when: false

    - name: Determine whether nic-flat is missing
      ansible.builtin.set_fact:
        vm_network_names: "{{ (vm_definition.stdout | from_json).spec.template.spec.networks | default([]) | map(attribute='name') | list }}"
        vm_interface_names: "{{ (vm_definition.stdout | from_json).spec.template.spec.domain.devices.interfaces | default([]) | map(attribute='name') | list }}"

    - name: Record whether the VM template needs Multus
      ansible.builtin.set_fact:
        needs_multus: "{{ 'nic-flat' not in vm_network_names or 'nic-flat' not in vm_interface_names }}"

    - name: Require explicit restart approval if the template needs a network change
      ansible.builtin.assert:
        that:
          - confirm_restart | bool
        fail_msg: >-
          The VM needs nic-flat added. Re-run with -e confirm_restart=true to apply the
          template change and restart rhel10imagemode.
      when: needs_multus

    - name: Add the default and flat interfaces to the VM template
      ansible.builtin.command:
        argv:
          - oc
          - patch
          - vm
          - "{{ vm_name }}"
          - -n
          - "{{ vm_namespace }}"
          - --type=merge
          - -p
          - "{{ network_patch | to_json }}"
      when: needs_multus
      changed_when: true

    - name: Stop the VM so the new interface is applied
      ansible.builtin.command:
        argv:
          - virtctl
          - stop
          - "{{ vm_name }}"
          - -n
          - "{{ vm_namespace }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: needs_multus
      changed_when: true

    - name: Wait for the old VMI to stop
      ansible.builtin.command:
        argv:
          - oc
          - wait
          - --for=delete
          - "vmi/{{ vm_name }}"
          - -n
          - "{{ vm_namespace }}"
          - --timeout=5m
      when: needs_multus
      changed_when: false

    - name: Start the VM with the updated network
      ansible.builtin.command:
        argv:
          - virtctl
          - start
          - "{{ vm_name }}"
          - -n
          - "{{ vm_namespace }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: needs_multus
      changed_when: true

    - name: Wait until the image-mode VMI is Ready
      ansible.builtin.command:
        argv:
          - oc
          - wait
          - --for=condition=Ready
          - "vmi/{{ vm_name }}"
          - -n
          - "{{ vm_namespace }}"
          - --timeout=10m
      changed_when: false

    - name: Show the VMI interface addresses
      ansible.builtin.command: oc get vmi rhel10imagemode -n mtv-user1 -o json
      register: vmi_interfaces
      changed_when: false

    - name: Extract interface names and IP addresses
      ansible.builtin.set_fact:
        assigned_interfaces: "{{ (vmi_interfaces.stdout | from_json).status.interfaces | default([]) }}"

    - name: Display assigned interface addresses
      ansible.builtin.debug:
        var: assigned_interfaces
