---
- name: Publish the lab guide to the util web server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_id: mpfcp
    expected_users:
      - user1
      - user2
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_techquest"
    ssh_known_hosts: "{{ lookup('env', 'HOME') }}/.ssh/kubevirt_known_hosts-{{ cluster_id }}"
    credentials_file: "{{ repo_dir }}/labguide/credentials.yaml"

  tasks:
    - name: Parse participant credentials without displaying passwords
      ansible.builtin.set_fact:
        credentials_data: "{{ lookup('file', credentials_file) | from_yaml }}"
      no_log: true

    - name: Extract cluster IDs and usernames from the credentials file
      ansible.builtin.set_fact:
        credential_cluster_ids: "{{ credentials_data.data | dict2items | selectattr('key', 'search', '\\.cid$') | map(attribute='value') | unique | list }}"
        credential_usernames: "{{ credentials_data.data | dict2items | selectattr('key', 'search', '\\.uid$') | map(attribute='value') | unique | sort | list }}"
      no_log: true

    - name: Refuse to publish credentials for another event or user set
      ansible.builtin.assert:
        that:
          - credential_cluster_ids == [cluster_id]
          - credential_usernames == expected_users
        fail_msg: >-
          credentials.yaml must contain only cluster {{ cluster_id }} and users
          user1/user2 before publication. Password values are not displayed.

    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Refuse to publish to a different cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == 'https://api.cluster-' + cluster_id + '.dyn.redhatworkshops.io:6443'
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access to publish the guide
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == 'admin'
        fail_msg: "Log in as admin before publishing the lab guide."

    - name: Confirm the httpd route exists
      ansible.builtin.command: oc get route httpd -n default -o name
      changed_when: false

    - name: Confirm util is reachable before publishing
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - hostname
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      changed_when: false

    - name: Copy the validated guide to util
      ansible.builtin.shell: |
        set -o pipefail
        COPYFILE_DISABLE=1 tar -C labguide -cf - . |
          virtctl -n default ssh \
            --known-hosts "{{ ssh_known_hosts }}" \
            --local-ssh-opts='-o StrictHostKeyChecking=accept-new' \
            -i "{{ ssh_key }}" \
            -c 'sudo tar -xf - -C /var/www/html && sudo restorecon -R /var/www/html' \
            cloud-user@vmi/util
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      changed_when: true
      no_log: true
