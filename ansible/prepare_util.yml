---
- name: Prepare util VM and web server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_techquest"

  tasks:
    - name: Read cluster settings and participant count from env.sh
      ansible.builtin.shell: |
        source ./env.sh
        cid="${MULTICLUSTERID:-$MUTLICLUSTERID}"
        first_cid=$(echo "$cid" | awk '{print $1}')
        target_cid="${TARGET_CLUSTER:-$first_cid}"
        printf "%s\n%s\n%s\n" "$cid" "$target_cid" "${MAXUSERS:-$MAXUSER}"
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      register: lab_settings
      changed_when: false

    - name: Store dynamic lab settings
      ansible.builtin.set_fact:
        configured_clusters: "{{ lab_settings.stdout_lines[0].split() }}"
        cluster_id: "{{ cluster_id if (cluster_id is defined and cluster_id | length > 0) else lab_settings.stdout_lines[1] }}"
        max_users: "{{ (max_users if (max_users is defined and max_users | length > 0) else lab_settings.stdout_lines[2]) | int }}"
        ssh_known_hosts: "{{ lookup('env', 'HOME') }}/.ssh/kubevirt_known_hosts-{{ cluster_id if (cluster_id is defined and cluster_id | length > 0) else lab_settings.stdout_lines[1] }}"

    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Refuse to prepare a different cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == "https://api.cluster-" + cluster_id + ".dyn.redhatworkshops.io:6443"
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == "admin"
        fail_msg: "Log in as admin before preparing util."

    - name: Check if util VM exists in default namespace
      ansible.builtin.command:
        argv:
          - oc
          - get
          - vm
          - util
          - -n
          - default
          - -o
          - name
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: util_vm_presence
      changed_when: false
      failed_when: false

    - name: Create util VM from template if missing
      ansible.builtin.command:
        argv:
          - oc
          - apply
          - -f
          - "{{ repo_dir }}/yaml/util.yaml"
          - -n
          - default
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: util_vm_presence.rc != 0
      changed_when: true

    - name: Ensure util VM is running
      ansible.builtin.command:
        argv:
          - virtctl
          - start
          - util
          - -n
          - default
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: start_util
      changed_when: "'started' in start_util.stdout"
      failed_when: false

    - name: Wait for util VirtualMachineInstance to become Ready
      ansible.builtin.command:
        argv:
          - oc
          - wait
          - --for=condition=Ready
          - vmi/util
          - -n
          - default
          - --timeout=300s
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      changed_when: false

    - name: Ensure httpd and tools are installed and running on util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - "sudo bash -lc 'dnf install -y httpd tar && systemctl enable --now httpd'"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      changed_when: true

    - name: Check if httpd service exists in default namespace
      ansible.builtin.command:
        argv:
          - oc
          - get
          - service
          - httpd
          - -n
          - default
          - -o
          - name
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: httpd_service_presence
      changed_when: false
      failed_when: false

    - name: Expose util httpd service if missing
      ansible.builtin.command:
        argv:
          - oc
          - expose
          - vm
          - util
          - --name=httpd
          - --port=80
          - --target-port=80
          - -n
          - default
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: httpd_service_presence.rc != 0
      changed_when: true

    - name: Check if httpd route exists in default namespace
      ansible.builtin.command:
        argv:
          - oc
          - get
          - route
          - httpd
          - -n
          - default
          - -o
          - name
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: httpd_route_presence
      changed_when: false
      failed_when: false

    - name: Create route for util httpd service if missing
      ansible.builtin.command:
        argv:
          - oc
          - create
          - route
          - edge
          - httpd
          - --service=httpd
          - -n
          - default
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: httpd_route_presence.rc != 0
      changed_when: true
