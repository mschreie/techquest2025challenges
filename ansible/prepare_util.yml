---
# CHANGED: Ansible replacement for the organizer portion of 03_create_utilVM.sh.
- name: Ensure util exists and serves the lab guide
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_id: mpfcp
    rhsm_org_id: "11009103"
    rhsm_activation_key: RHEL
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_techquest"
    ssh_known_hosts: "{{ lookup('env', 'HOME') }}/.ssh/kubevirt_known_hosts-{{ cluster_id }}"
    util_namespace: default
    util_name: util
    util_workdir: /root/rhel_image_mode-main

  tasks:
    - name: Read cluster settings and signed image URL from env.sh
      ansible.builtin.shell: |
        source ./env.sh
        printf '%s\n' "$MUTLICLUSTERID" "$IMAGEBUILDERURL"
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      register: lab_settings
      changed_when: false
      no_log: true

    - name: Store lab settings
      ansible.builtin.set_fact:
        configured_clusters: "{{ lab_settings.stdout_lines[0].split() }}"
        image_builder_url: "{{ lab_settings.stdout_lines[1] }}"
      no_log: true

    - name: Confirm the requested cluster is configured
      ansible.builtin.assert:
        that:
          - cluster_id in configured_clusters
        fail_msg: "Cluster {{ cluster_id }} is not listed in env.sh."

    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Refuse to prepare util on a different cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == 'https://api.cluster-' + cluster_id + '.dyn.redhatworkshops.io:6443'
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == 'admin'
        fail_msg: "Log in as admin before preparing util."

    - name: Create the cluster-specific known-hosts directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.ssh"
        state: directory
        mode: '0700'

    - name: Inspect the util VM
      ansible.builtin.command:
        argv:
          - oc
          - get
          - vm
          - "{{ util_name }}"
          - -n
          - "{{ util_namespace }}"
          - -o
          - name
      register: util_vm_check
      changed_when: false
      failed_when: util_vm_check.rc != 0 and 'NotFound' not in util_vm_check.stderr

    - name: Ensure the SSH public-key secret exists
      ansible.builtin.command:
        argv:
          - oc
          - apply
          - -f
          - files/secret.yaml
          - -n
          - "{{ util_namespace }}"
      args:
        chdir: "{{ repo_dir }}"
      register: util_secret_apply
      changed_when: "'unchanged' not in util_secret_apply.stdout"

    - name: Create util only when it does not exist
      ansible.builtin.shell: |
        set -o pipefail
        virtctl create vm --instancetype u1.small --name util \
          --volume-import "type:http,size:20Gi,url:{{ image_builder_url }}" |
        awk '
          /^      terminationGracePeriodSeconds: 180/ {
            print
            print "      accessCredentials:"
            print "        - sshPublicKey:"
            print "            propagationMethod:"
            print "              noCloud: {}"
            print "            source:"
            print "              secret:"
            print "                secretName: techquest"
            next
          }
          /^status: {}/ {
            print "      - cloudInitNoCloud:"
            print "          userData: |-"
            print "            #cloud-config"
            print "            user: cloud-user"
            print "            password: redhat"
            print "            chpasswd: { expire: False }"
            print "        name: cloudinitdisk"
            print
            next
          }
          { print }
        ' |
        oc create -f - -n default
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: util_vm_check.rc != 0
      register: util_vm_create
      changed_when: true
      no_log: true

    - name: Wait for the util VMI to become Ready
      ansible.builtin.command:
        argv:
          - oc
          - wait
          - --for=condition=Ready
          - vmi/util
          - -n
          - default
          - --timeout=10m
      changed_when: false

    - name: Wait for SSH on util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - hostname
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: util_ssh
      changed_when: false
      retries: 30
      delay: 10
      until: util_ssh.rc == 0

    - name: Calculate the local lab ZIP checksum
      ansible.builtin.command: sha256sum "{{ repo_dir }}/files/rhel_image_mode-main.zip"
      register: local_zip_checksum
      changed_when: false

    - name: Read the ZIP checksum from util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - "sha256sum /home/cloud-user/rhel_image_mode-main.zip"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: remote_zip_checksum
      changed_when: false
      failed_when: false

    - name: Copy the lab ZIP only when missing or different
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - scp
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - "{{ repo_dir }}/files/rhel_image_mode-main.zip"
          - cloud-user@vmi/util:.
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: >-
        remote_zip_checksum.rc != 0 or
        (remote_zip_checksum.stdout.split() | first | default('')) !=
        (local_zip_checksum.stdout.split() | first)
      register: util_zip_copy
      changed_when: true

    - name: Check whether util work directory exists
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - "sudo test -f {{ util_workdir }}/Containerfile && sudo test -d {{ util_workdir }}/output"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: util_workdir_check
      changed_when: false
      failed_when: false

    - name: Extract ZIP only when util work directory is missing
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - >-
            sudo bash -lc 'if [ ! -f {{ util_workdir }}/Containerfile ]; then
            unzip -oq /home/cloud-user/rhel_image_mode-main.zip -d /root &&
            rm -f {{ util_workdir }}/README.md; fi;
            mkdir -p {{ util_workdir }}/output'
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: util_workdir_check.rc != 0
      register: util_extract
      changed_when: true

    - name: Check CLI tools on util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - "sudo test -x /usr/local/bin/oc && sudo test -x /usr/local/bin/virtctl"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: util_tools_check
      changed_when: false
      failed_when: false

    - name: Install missing oc and virtctl on util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - >-
            sudo bash -lc 'set -e;
            if [ ! -x /usr/local/bin/oc ]; then
            curl -fL -o /tmp/oc.tar https://downloads-openshift-console.apps.cluster-{{ cluster_id }}.dyn.redhatworkshops.io/amd64/linux/oc.tar;
            tar xf /tmp/oc.tar -C /usr/local/bin; fi;
            if [ ! -x /usr/local/bin/virtctl ]; then
            curl -fL -o /tmp/virtctl.tar.gz https://hyperconverged-cluster-cli-download-openshift-cnv.apps.cluster-{{ cluster_id }}.dyn.redhatworkshops.io/amd64/linux/virtctl.tar.gz;
            tar xzf /tmp/virtctl.tar.gz -C /usr/local/bin; fi;
            chmod 0755 /usr/local/bin/oc /usr/local/bin/virtctl;
            restorecon /usr/local/bin/oc /usr/local/bin/virtctl;
            grep -qxF "export PATH=/usr/local/bin:\$PATH" /root/.bash_profile ||
            echo "export PATH=/usr/local/bin:\$PATH" >> /root/.bash_profile;
            echo TOOLS_READY'
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: util_tools_check.rc != 0
      register: util_tool_install
      changed_when: "'TOOLS_READY' in util_tool_install.stdout"

    - name: Check Red Hat subscription identity on util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - sudo subscription-manager identity
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: util_identity
      changed_when: false
      failed_when: false
      no_log: true

    - name: Refuse a util registration owned by another organization
      ansible.builtin.assert:
        that:
          - "'org ID: ' + rhsm_org_id in util_identity.stdout"
        fail_msg: "util is not registered to the expected Red Hat organization; no registration was changed."
      when: util_identity.rc == 0

    - name: Register util only when its subscription is missing
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - "sudo subscription-manager register --org {{ rhsm_org_id }} --activationkey {{ rhsm_activation_key }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: util_identity.rc != 0 and 'not yet registered' in (util_identity.stderr | lower)
      register: util_register
      changed_when: true
      no_log: true

    - name: Read registry configuration on util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - sudo cat /etc/containers/registries.conf.d/99-openshift-internal.conf
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: util_registry_config
      changed_when: false
      failed_when: false

    - name: Copy registry configuration to util when missing or different
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - scp
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - "{{ repo_dir }}/files/99-openshift-internal.conf"
          - cloud-user@vmi/util:.
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: util_registry_config.rc != 0 or (util_registry_config.stdout | trim) != (lookup('file', repo_dir + '/files/99-openshift-internal.conf') | trim)
      register: util_registry_copy
      changed_when: true

    - name: Install registry configuration with correct SELinux label
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - >-
            sudo install -D -m 0644 /home/cloud-user/99-openshift-internal.conf
            /etc/containers/registries.conf.d/99-openshift-internal.conf &&
            sudo restorecon /etc/containers/registries.conf.d/99-openshift-internal.conf
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: util_registry_copy is changed
      changed_when: true

    - name: Check if Pandoc is installed
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - command -v pandoc
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: pandoc_check
      changed_when: false
      failed_when: false

    - name: Install Pandoc if missing
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - >-
            sudo bash -lc 'subscription-manager release --unset || true;
            subscription-manager repos --enable codeready-builder-for-rhel-10-x86_64-rhui-rpms;
            dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm;
            crb enable; dnf install -y pandoc'
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: pandoc_check.rc != 0
      changed_when: true

    - name: Calculate local Markdown helper checksums
      ansible.builtin.stat:
        path: "{{ repo_dir }}/files/{{ item }}"
        checksum_algorithm: sha256
      loop:
        - markdown.conf
        - md2html
      loop_control:
        label: "{{ item }}"
      register: local_helper_checksums

    - name: Read installed Apache helper checksums
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - sudo sha256sum /etc/httpd/conf.d/markdown.conf /usr/local/bin/md2html
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: remote_helper_checksums
      changed_when: false
      failed_when: false

    - name: Copy only changed Markdown helper files to util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - scp
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - "{{ repo_dir }}/files/{{ item }}"
          - "cloud-user@vmi/util:{{ item }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop:
        - markdown.conf
        - md2html
      loop_control:
        index_var: helper_index
        label: "{{ item }}"
      when: >-
        remote_helper_checksums.rc != 0 or
        local_helper_checksums.results[helper_index].stat.checksum not in remote_helper_checksums.stdout
      register: helper_copy
      changed_when: true

    - name: Install changed Apache helper files and configure SELinux
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - >-
            sudo install -m 0755 /home/cloud-user/md2html /usr/local/bin/md2html &&
            sudo install -m 0644 /home/cloud-user/markdown.conf /etc/httpd/conf.d/markdown.conf &&
            sudo setsebool -P httpd_execmem on &&
            sudo restorecon /usr/local/bin/md2html /etc/httpd/conf.d/markdown.conf &&
            if [ -f /etc/httpd/conf.d/welcome.conf ]; then sudo mv /etc/httpd/conf.d/welcome.conf /etc/httpd/conf.d/welcome.conf.disabled; fi &&
            sudo apachectl configtest && sudo systemctl enable --now httpd.service && sudo systemctl restart httpd.service
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: helper_copy is changed
      register: apache_config
      changed_when: true

    - name: Ensure the httpd service exists
      ansible.builtin.command: oc get service httpd -n default -o name
      register: httpd_service
      changed_when: false
      failed_when: false

    - name: Expose util when the service is missing
      ansible.builtin.command:
        argv:
          - virtctl
          - expose
          - vmi
          - util
          - -n
          - default
          - --name=httpd
          - --port=80
          - --target-port=80
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      when: httpd_service.rc != 0
      changed_when: true

    - name: Ensure the httpd route exists
      ansible.builtin.command: oc get route httpd -n default -o name
      register: httpd_route
      changed_when: false
      failed_when: false

    - name: Create the edge route when missing
      ansible.builtin.command:
        argv:
          - oc
          - create
          - route
          - edge
          - httpd
          - -n
          - default
          - --service=httpd
          - --insecure-policy=Redirect
      when: httpd_route.rc != 0
      changed_when: true
