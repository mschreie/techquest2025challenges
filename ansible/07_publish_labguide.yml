---
- name: Publish the lab guide to the util web server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_tasks: tasks/publish_labguide.yml
    credentials_file: "{{ repo_dir }}/labguide/credentials.yaml"
  tasks:
    - name: Run this step on every cluster in env.sh
      ansible.builtin.include_tasks: tasks/for_each_cluster.yml
