---
- name: Start and wait for organizer-prepared lab VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_id: mpfcp
    user_ids: "{{ range(1, max_users + 1) | list }}"

  tasks:
    - name: Read configured clusters and participant count from env.sh
      ansible.builtin.shell: |
        source ./env.sh
        printf '%s\n' "$MUTLICLUSTERID" "$MAXUSER"
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      register: lab_settings
      changed_when: false

    - name: Store lab settings
      ansible.builtin.set_fact:
        configured_clusters: "{{ lab_settings.stdout_lines[0].split() }}"
        max_users: "{{ lab_settings.stdout_lines[1] | int }}"

    - name: Confirm the requested cluster is configured
      ansible.builtin.assert:
        that:
          - cluster_id in configured_clusters
        fail_msg: "Cluster {{ cluster_id }} is not listed in env.sh."

    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Refuse to start VMs in a different cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == 'https://api.cluster-' + cluster_id + '.dyn.redhatworkshops.io:6443'
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access to start prepared VMs
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == 'admin'
        fail_msg: "Log in as admin before starting prepared VMs."

    - name: Define util and participant thesource targets
      ansible.builtin.set_fact:
        vm_targets:
          - name: util
            namespace: default

    - name: Add each participant thesource VM
      ansible.builtin.set_fact:
        vm_targets: "{{ vm_targets + [{'name': 'thesource', 'namespace': 'mtv-user' ~ item}] }}"
      loop: "{{ user_ids }}"

    - name: Read VM configuration
      ansible.builtin.command:
        argv:
          - oc
          - get
          - vm
          - "{{ item.name }}"
          - -n
          - "{{ item.namespace }}"
          - -o
          - json
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ vm_targets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"
      register: vm_specs
      changed_when: false

    - name: Read current VMI phase
      ansible.builtin.command:
        argv:
          - oc
          - get
          - vmi
          - "{{ item.name }}"
          - -n
          - "{{ item.namespace }}"
          - -o
          - jsonpath={.status.phase}
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ vm_targets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"
      register: vmi_phases
      changed_when: false
      failed_when: false

    - name: Start VMs explicitly stopped with no VMI
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - "{{ item.item.namespace }}"
          - start
          - "{{ item.item.name }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ vmi_phases.results }}"
      loop_control:
        index_var: vm_index
        label: "{{ item.item.namespace }}/{{ item.item.name }}"
      when: >-
        item.rc != 0 and
        (vm_specs.results[vm_index].stdout | from_json).spec.runStrategy | default('Always') in ['Halted', 'Manual']
      register: start_results
      changed_when: true

    - name: Wait for every prepared VMI to become Ready
      ansible.builtin.command:
        argv:
          - oc
          - wait
          - --for=condition=Ready
          - "vmi/{{ item.name }}"
          - -n
          - "{{ item.namespace }}"
          - --timeout=10m
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ vm_targets }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"
      register: ready_results
      changed_when: false

    - name: Show prepared VM readiness
      ansible.builtin.debug:
        msg: "{{ item.item.namespace }}/{{ item.item.name }}: Ready"
      loop: "{{ ready_results.results }}"
      loop_control:
        label: "{{ item.item.namespace }}/{{ item.item.name }}"
