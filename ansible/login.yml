---
- name: Log in to the configured OpenShift cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_id: mpfcp

  tasks:
    - name: Read configured clusters and admin password from env.sh
      ansible.builtin.shell: |
        source ./env.sh
        pw_name="ADMINPW_{{ cluster_id }}"
        printf '%s\n' "$MUTLICLUSTERID" "${!pw_name}"
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      register: login_settings
      changed_when: false
      no_log: true

    - name: Store protected login values
      ansible.builtin.set_fact:
        configured_clusters: "{{ login_settings.stdout_lines[0].split() }}"
        admin_password: "{{ login_settings.stdout_lines[1] }}"
      no_log: true

    - name: Confirm the requested cluster is configured
      ansible.builtin.assert:
        that:
          - cluster_id in configured_clusters
        fail_msg: "Cluster {{ cluster_id }} is not listed in env.sh."

    - name: Log in to OpenShift without displaying the admin password
      ansible.builtin.command:
        argv:
          - oc
          - login
          - -u
          - admin
          - -p
          - "{{ admin_password }}"
          - "https://api.cluster-{{ cluster_id }}.dyn.redhatworkshops.io:6443/"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: login_result
      changed_when: true
      no_log: true

    - name: Verify the active API server
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Verify the active identity
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm login reached the requested cluster as admin
      ansible.builtin.assert:
        that:
          - active_server.stdout == 'https://api.cluster-' + cluster_id + '.dyn.redhatworkshops.io:6443'
          - active_user.stdout == 'admin'
        fail_msg: "The active OpenShift session is not admin on cluster {{ cluster_id }}."
