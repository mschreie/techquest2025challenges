---
- name: Prepare thesource files and CLI tools
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_techquest"
    zip_local_path: "{{ repo_dir }}/files/rhel_image_mode-main.zip"
    zip_remote_path: /home/cloud-user/rhel_image_mode-main.zip
    workdir_remote: /root/rhel_image_mode-main

  tasks:
    - name: Read cluster settings and participant count from env.sh
      ansible.builtin.shell: |
        source ./env.sh
        cid="${MULTICLUSTERID:-$MUTLICLUSTERID}"
        first_cid=$(echo "$cid" | awk '{print $1}')
        target_cid="${TARGET_CLUSTER:-$first_cid}"
        printf "%s\n%s\n%s\n" "$cid" "$target_cid" "${MAXUSERS:-$MAXUSER}"
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      register: lab_settings
      changed_when: false

    - name: Store dynamic lab settings
      ansible.builtin.set_fact:
        configured_clusters: "{{ lab_settings.stdout_lines[0].split() }}"
        cluster_id: "{{ cluster_id if (cluster_id is defined and cluster_id | length > 0) else lab_settings.stdout_lines[1] }}"
        max_users: "{{ (max_users if (max_users is defined and max_users | length > 0) else lab_settings.stdout_lines[2]) | int }}"
        user_ids: "{{ range(1, ((max_users if (max_users is defined and max_users | length > 0) else lab_settings.stdout_lines[2]) | int) + 1) | list }}"
        ssh_known_hosts: "{{ lookup('env', 'HOME') }}/.ssh/kubevirt_known_hosts-{{ cluster_id if (cluster_id is defined and cluster_id | length > 0) else lab_settings.stdout_lines[1] }}"

    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Refuse to prepare a different cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == "https://api.cluster-" + cluster_id + ".dyn.redhatworkshops.io:6443"
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == "admin"
        fail_msg: "Log in as admin before preparing thesource VMs."

    - name: Compute sha256 checksum of local lab zip
      ansible.builtin.stat:
        path: "{{ zip_local_path }}"
        checksum_algorithm: sha256
      register: local_zip_stat

    - name: Fail if the local lab zip does not exist
      ansible.builtin.assert:
        that:
          - local_zip_stat.stat.exists
        fail_msg: "Local zip {{ zip_local_path }} does not exist."

    - name: Check if the lab zip already exists on each thesource VM
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - "mtv-user{{ item }}"
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/thesource
          - -c
          - "sha256sum {{ zip_remote_path }} 2>/dev/null || echo MISSING"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ user_ids }}"
      loop_control:
        label: "mtv-user{{ item }}"
      register: remote_zip_checks
      changed_when: false
      failed_when: false
      no_log: true

    - name: Copy lab zip to thesource VMs when missing or checksum differs
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - "mtv-user{{ item.item }}"
          - scp
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - "{{ zip_local_path }}"
          - "cloud-user@vmi/thesource:{{ zip_remote_path }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ remote_zip_checks.results }}"
      loop_control:
        label: "mtv-user{{ item.item }}"
      when: local_zip_stat.stat.checksum not in item.stdout
      changed_when: true

    - name: Extract lab zip into root workdir if directory does not exist
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - "mtv-user{{ item }}"
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/thesource
          - -c
          - "sudo bash -lc 'if [ ! -d {{ workdir_remote }} ]; then mkdir -p /root && unzip -q -o {{ zip_remote_path }} -d /root; fi'"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ user_ids }}"
      loop_control:
        label: "mtv-user{{ item }}"
      changed_when: true

    - name: Ensure CLI binaries oc and virtctl are installed in /usr/local/bin
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - "mtv-user{{ item }}"
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/thesource
          - -c
          - >-
            sudo bash -lc '
            for bin in oc virtctl; do
              if ! command -v $bin >/dev/null 2>&1; then
                if [ -f {{ workdir_remote }}/$bin ]; then
                  install -m 0755 {{ workdir_remote }}/$bin /usr/local/bin/$bin
                elif [ -f /home/cloud-user/$bin ]; then
                  install -m 0755 /home/cloud-user/$bin /usr/local/bin/$bin
                fi
              fi
            done'
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      loop: "{{ user_ids }}"
      loop_control:
        label: "mtv-user{{ item }}"
      changed_when: true
