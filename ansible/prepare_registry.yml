---
- name: Copy required container images into the OpenShift internal registry
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: registry_user
      prompt: Red Hat registry service-account username
      private: false
    - name: registry_token
      prompt: Red Hat registry service-account token
      private: true
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_tasks: tasks/prepare_registry.yml
  tasks:
    - name: Run this step on every cluster in env.sh
      ansible.builtin.include_tasks: tasks/for_each_cluster.yml
