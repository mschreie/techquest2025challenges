---
- name: Copy required container images into the OpenShift internal registry
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: registry_user
      prompt: Red Hat registry service-account username
      private: false
    - name: registry_token
      prompt: Red Hat registry service-account token
      private: true
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_techquest"

  tasks:
    - name: Read cluster settings and admin password dynamically from env.sh
      ansible.builtin.shell: |
        source ./env.sh
        cid="${MULTICLUSTERID:-$MUTLICLUSTERID}"
        first_cid=$(echo "$cid" | awk '{print $1}')
        target_cid="${TARGET_CLUSTER:-$first_cid}"
        pw_name="ADMINPW_${target_cid}"
        printf "%s\n%s\n%s\n" "$cid" "$target_cid" "${!pw_name}"
      args:
        executable: /bin/bash
        chdir: "{{ repo_dir }}"
      register: cluster_credentials
      changed_when: false
      no_log: true

    - name: Store protected runtime values
      ansible.builtin.set_fact:
        configured_clusters: "{{ cluster_credentials.stdout_lines[0].split() }}"
        cluster_id: "{{ cluster_id if (cluster_id is defined and cluster_id | length > 0) else cluster_credentials.stdout_lines[1] }}"
        admin_password: "{{ cluster_credentials.stdout_lines[2] }}"
        ssh_known_hosts: "{{ lookup('env', 'HOME') }}/.ssh/kubevirt_known_hosts-{{ cluster_id if (cluster_id is defined and cluster_id | length > 0) else cluster_credentials.stdout_lines[1] }}"
        registry_input: "{{ cluster_credentials.stdout_lines[1] }}\n{{ cluster_credentials.stdout_lines[2] }}\n{{ registry_user }}\n{{ registry_token }}"
      no_log: true

    - name: Confirm the requested cluster is configured
      ansible.builtin.assert:
        that:
          - cluster_id in configured_clusters
        fail_msg: "Cluster {{ cluster_id }} is not listed in env.sh."

    - name: Confirm the active OpenShift endpoint
      ansible.builtin.command: oc whoami --show-server
      register: active_server
      changed_when: false

    - name: Confirm this play targets the current cluster
      ansible.builtin.assert:
        that:
          - active_server.stdout == "https://api.cluster-" + cluster_id + ".dyn.redhatworkshops.io:6443"
        fail_msg: "oc is connected to {{ active_server.stdout }}, not {{ cluster_id }}."

    - name: Require admin access to push to the internal registry
      ansible.builtin.command: oc whoami
      register: active_user
      changed_when: false

    - name: Confirm admin access
      ansible.builtin.assert:
        that:
          - active_user.stdout == "admin"
        fail_msg: "Log in as admin before copying images to the shared openshift project."

    - name: Copy the current prepRegistry script to util
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - scp
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=no
          - --local-ssh-opts=-o UserKnownHostsFile=/dev/null
          - --local-ssh-opts=-o LogLevel=ERROR
          - -i
          - "{{ ssh_key }}"
          - "{{ repo_dir }}/prepRegistry.sh"
          - cloud-user@vmi/util:prepRegistry.sh
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      changed_when: true

    - name: Pull and push the required images
      ansible.builtin.command:
        argv:
          - virtctl
          - -n
          - default
          - ssh
          - --known-hosts
          - "{{ ssh_known_hosts }}"
          - --local-ssh-opts=-o StrictHostKeyChecking=no
          - --local-ssh-opts=-o UserKnownHostsFile=/dev/null
          - --local-ssh-opts=-o LogLevel=ERROR
          - -i
          - "{{ ssh_key }}"
          - cloud-user@vmi/util
          - -c
          - "bash -c 'IFS= read -r CLUSTERID; IFS= read -r ADMIN_PW; IFS= read -r REGISTRY_USER; IFS= read -r MYPW; export CLUSTERID ADMIN_PW REGISTRY_USER MYPW; bash ~/prepRegistry.sh'"
        stdin: "{{ registry_input }}"
      environment:
        PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
      register: image_copy
      changed_when: true
      no_log: true
