---
- name: Safely inspect or clean up registered lab VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_tasks: tasks/cleanup_lab.yml
    rhsm_org_id: "11009103"
    confirm_cleanup: false
  tasks:
    - name: Run this step on every cluster in env.sh
      ansible.builtin.include_tasks: tasks/for_each_cluster.yml
