---
- name: Parse participant credentials
  ansible.builtin.set_fact:
    credentials_data: "{{ lookup('file', credentials_file) | from_yaml }}"

- name: Build the participant usernames expected from MAXUSER
  ansible.builtin.set_fact:
    expected_users: "{{ range(1, (max_users | int) + 1) | map('string') | map('regex_replace', '^', 'user') | list }}"

- name: Collect cluster ids named in the credentials file
  ansible.builtin.set_fact:
    credential_cluster_ids: "{{ credentials_data.data | dict2items | selectattr('key', 'search', '\\.cid$') | map(attribute='value') | unique | list }}"

- name: Warn when credentials.yaml does not list the same clusters
  ansible.builtin.debug:
    msg: >-
      Warning: credentials.yaml lists {{ credential_cluster_ids | sort | join(', ') }}.
      env.sh lists {{ cluster_ids | sort | join(', ') }}.
      Publishing continues.
  when: credential_cluster_ids | sort != cluster_ids | sort

- name: Collect usernames published for this cluster
  ansible.builtin.set_fact:
    cluster_usernames: "{{ credentials_data.data | dict2items | selectattr('key', 'search', '\\.cid$') | selectattr('value', 'equalto', cluster_id) | map(attribute='key') | map('regex_replace', '\\.cid$', '.uid') | map('extract', credentials_data.data) | unique | sort | list }}"

- name: Warn when this cluster's published users differ from MAXUSER
  ansible.builtin.debug:
    msg: >-
      Warning: cluster {{ cluster_id }} in credentials.yaml has users {{ cluster_usernames | join(', ') | default('none', true) }}.
      Expected {{ expected_users | join(', ') }}.
      Publishing continues.
  when: cluster_usernames | sort != expected_users | sort

- name: Confirm the httpd route exists
  ansible.builtin.command: oc get route httpd -n default -o name
  changed_when: false

- name: Confirm util is reachable before publishing
  ansible.builtin.command:
    argv:
      - virtctl
      - -n
      - default
      - ssh
      - --known-hosts
      - "{{ ssh_known_hosts }}"
      - --local-ssh-opts=-o UserKnownHostsFile={{ ssh_known_hosts }}
      - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
      - -i
      - "{{ ssh_key }}"
      - cloud-user@vmi/util
      - -c
      - hostname
  environment:
    PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
  changed_when: false

- name: Copy the credentials lookup files to util
  ansible.builtin.command:
    argv:
      - virtctl
      - -n
      - default
      - scp
      - --known-hosts
      - "{{ ssh_known_hosts }}"
      - --local-ssh-opts=-o UserKnownHostsFile={{ ssh_known_hosts }}
      - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
      - -i
      - "{{ ssh_key }}"
      - "{{ item.src }}"
      - "cloud-user@vmi/util:{{ item.dest }}"
  environment:
    PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
  loop:
    - src: "{{ repo_dir }}/files/credentials.cgi"
      dest: credentials.cgi
    - src: "{{ repo_dir }}/files/credentials.conf"
      dest: credentials.conf
    - src: "{{ credentials_file }}"
      dest: credentials.yaml
  loop_control:
    label: "{{ item.dest }}"
  changed_when: true

- name: Install the team lookup outside the web root
  ansible.builtin.command:
    argv:
      - virtctl
      - -n
      - default
      - ssh
      - --known-hosts
      - "{{ ssh_known_hosts }}"
      - --local-ssh-opts=-o UserKnownHostsFile={{ ssh_known_hosts }}
      - --local-ssh-opts=-o StrictHostKeyChecking=accept-new
      - -i
      - "{{ ssh_key }}"
      - cloud-user@vmi/util
      - -c
      - >-
        sudo bash -lc 'install -d -m 0755 -o root -g root /var/www/cgi-bin &&
        install -d -m 0750 -o root -g apache /var/www/credentials &&
        install -m 0755 -o root -g root /home/cloud-user/credentials.cgi /var/www/cgi-bin/credentials.cgi &&
        install -m 0640 -o root -g apache /home/cloud-user/credentials.yaml /var/www/credentials/credentials.yaml &&
        install -m 0644 -o root -g root /home/cloud-user/credentials.conf /etc/httpd/conf.d/credentials.conf &&
        rm -f /home/cloud-user/credentials.yaml /home/cloud-user/credentials.cgi /home/cloud-user/credentials.conf /var/www/html/credentials.yaml &&
        (restorecon -R /var/www/cgi-bin/credentials.cgi /var/www/credentials /etc/httpd/conf.d/credentials.conf 2>/dev/null || true) &&
        if command -v getsebool >/dev/null 2>&1 && ! getsebool httpd_enable_cgi | grep -q " --> on"; then setsebool -P httpd_enable_cgi on || true; fi &&
        /usr/sbin/httpd -t && systemctl enable --now httpd && systemctl reload httpd'
  environment:
    PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
  changed_when: true

- name: Copy the validated guide to util
  ansible.builtin.shell: |
    set -o pipefail
    COPYFILE_DISABLE=1 tar -C labguide --exclude credentials.yaml -cf - . |
      virtctl -n default ssh \
        --known-hosts "{{ ssh_known_hosts }}" \
        --local-ssh-opts="-o UserKnownHostsFile={{ ssh_known_hosts }}" \
        --local-ssh-opts='-o StrictHostKeyChecking=accept-new' \
        -i "{{ ssh_key }}" \
        -c 'sudo tar -xf - -C /var/www/html && sudo rm -f /var/www/html/credentials.yaml && (sudo restorecon -R /var/www/html 2>/dev/null || true)' \
        cloud-user@vmi/util
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
  changed_when: true
