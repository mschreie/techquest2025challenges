---
- name: Check whether each thesource VM already exists
  ansible.builtin.command: oc get vm thesource -n mtv-user{{ item }}
  loop: "{{ range(1, max_users + 1) | list }}"
  loop_control:
    label: "mtv-user{{ item }}"
  register: vm_checks
  changed_when: false
  failed_when: vm_checks.rc != 0 and 'NotFound' not in vm_checks.stderr

- name: Ensure the SSH public-key secret exists in each project
  ansible.builtin.command: oc apply -f files/secret.yaml -n mtv-user{{ item }}
  args:
    chdir: "{{ repo_dir }}"
  loop: "{{ range(1, max_users + 1) | list }}"
  loop_control:
    label: "mtv-user{{ item }}"
  register: secret_apply
  changed_when: "'unchanged' not in secret_apply.stdout"

- name: Create a manifest only for missing VMs
  ansible.builtin.shell: |
    set -o pipefail
    virtctl create vm --instancetype u1.small --name thesource \
      --volume-import "type:http,size:20Gi,url:{{ image_builder_url }}" |
    awk '
      /^      terminationGracePeriodSeconds: 180/ {
        print
        print "      accessCredentials:"
        print "        - sshPublicKey:"
        print "            propagationMethod:"
        print "              noCloud: {}"
        print "            source:"
        print "              secret:"
        print "                secretName: techquest"
        next
      }
      /^status: {}/ {
        print "      - cloudInitNoCloud:"
        print "          userData: |-"
        print "            #cloud-config"
        print "            user: cloud-user"
        print "            password: redhat"
        print "            chpasswd: { expire: False }"
        print "        name: cloudinitdisk"
        print
        next
      }
      { print }
    ' |
    oc create -f - -n "mtv-user{{ item }}"
  args:
    executable: /bin/bash
    chdir: "{{ repo_dir }}"
  environment:
    PATH: "{{ repo_dir }}/..:{{ lookup('env', 'PATH') }}"
  loop: "{{ range(1, max_users + 1) | list }}"
  loop_control:
    index_var: user_index
    label: "mtv-user{{ item }}"
  when: vm_checks.results[user_index].rc != 0
  changed_when: true
  no_log: true
