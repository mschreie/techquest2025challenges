---
- name: Load lab settings
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/load_lab_settings.yml"

- name: Show configured cluster ids
  ansible.builtin.debug:
    msg: "{{ cluster_ids }}"

- name: Run this step on every configured cluster
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/run_cluster_step.yml"
  loop: "{{ cluster_ids }}"
  loop_control:
    loop_var: cluster_id
    label: "{{ cluster_id }}"
