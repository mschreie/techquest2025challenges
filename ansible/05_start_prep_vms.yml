---
- name: Start and wait for organizer-prepared lab VMs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir | dirname }}"
    cluster_tasks: tasks/start_prep_vms.yml
  tasks:
    - name: Run this step on every cluster in env.sh
      ansible.builtin.include_tasks: tasks/for_each_cluster.yml
